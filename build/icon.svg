<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#AE92FF"/>
      <stop offset="0.5" stop-color="#8558F3"/>
      <stop offset="1" stop-color="#5225C6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="recto" x1="0.1" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE7F8"/>
    </linearGradient>
    <linearGradient id="verso" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#240B5C" flood-opacity="0.32"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="188" ry="188"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#ground)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <circle cx="286" cy="216" r="330" fill="#ffffff" opacity="0.06"/>
  </g>

  <!-- an open book: the left page is the verso, the right one is the recto -->
  <g filter="url(#drop)">
    <path d="M250 372 Q384 336 502 330 L502 702 Q384 704 250 738 Z" fill="url(#verso)"/>
    <path d="M522 330 Q640 336 774 372 L774 738 Q640 704 522 702 Z" fill="url(#recto)"/>
  </g>

  <!-- writing: firm on the recto, a memory of it on the verso -->
  <g fill="#6845D6">
    <g opacity="0.24">
      <rect x="300" y="422" width="168" height="19" rx="9.5"/>
      <rect x="300" y="486" width="128" height="19" rx="9.5"/>
      <rect x="300" y="550" width="152" height="19" rx="9.5"/>
    </g>
    <g opacity="0.52">
      <rect x="568" y="424" width="164" height="20" rx="10"/>
      <rect x="568" y="490" width="132" height="20" rx="10"/>
      <rect x="568" y="556" width="168" height="20" rx="10"/>
      <rect x="568" y="622" width="92" height="20" rx="10"/>
    </g>
  </g>
</svg>
